<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="A long lesson recording is cut down to a short recap, shown as a video frame with the coach's words written beside it and a chapter marker.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="78%"><stop offset="0" stop-color="#151c24"/><stop offset="1" stop-color="#0a0b10"/></radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a5a63"/><stop offset="1" stop-color="#0c2328"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="320" height="300" fill="url(#bg)"/>

  <text x="30" y="30" font-size="9" fill="#71717a" font-family="system-ui, -apple-system, sans-serif">The whole lesson</text>
  <rect x="30" y="38" width="260" height="10" rx="5" fill="#1b1b26" stroke="#2a2a38" stroke-width="1"/>

  <path d="M160 58 v12 M154 65 l6 6 l6 -6" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="30" y="94" font-size="9" fill="#67e8f9" font-family="system-ui, -apple-system, sans-serif">The recap</text>
  <g>
    <rect x="30" y="102" width="34" height="10" rx="4" fill="#22d3ee" fill-opacity="0.75"/>
    <rect x="70" y="102" width="26" height="10" rx="4" fill="#22d3ee" fill-opacity="0.75"/>
    <rect x="102" y="102" width="30" height="10" rx="4" fill="#22d3ee" filter="url(#glow)" fill-opacity="0.6"/>
    <rect x="102" y="102" width="30" height="10" rx="4" fill="#22d3ee"/>
    <rect x="138" y="102" width="22" height="10" rx="4" fill="#22d3ee" fill-opacity="0.75"/>
  </g>

  <rect x="44" y="140" width="232" height="130" rx="10" fill="#0e0e14" stroke="#2a2a38" stroke-width="1"/>

  <rect x="52" y="148" width="130" height="114" rx="6" fill="#101820"/>
  <line x1="62" y1="228" x2="172" y2="228" stroke="#3a3a46" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="76" y="196" width="82" height="6" rx="2" fill="url(#top)" stroke="#22d3ee" stroke-width="1.4"/>
  <line x1="82" y1="202" x2="82" y2="228" stroke="#22d3ee" stroke-width="1.4" stroke-opacity="0.5"/>
  <line x1="152" y1="202" x2="152" y2="228" stroke="#22d3ee" stroke-width="1.4" stroke-opacity="0.5"/>
  <line x1="117" y1="182" x2="117" y2="196" stroke="#e879f9" stroke-width="1.8"/>
  <g stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round" fill="none">
    <circle cx="64" cy="176" r="5" fill="#2a2a38" stroke="#a1a1aa" stroke-width="1.4"/>
    <line x1="64" y1="181" x2="64" y2="200"/><line x1="64" y1="186" x2="56" y2="194"/><line x1="64" y1="186" x2="72" y2="193"/>
    <line x1="64" y1="200" x2="59" y2="216"/><line x1="64" y1="200" x2="70" y2="216"/>
  </g>

  <rect x="190" y="148" width="78" height="114" rx="6" fill="#12222a" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1"/>
  <text x="200" y="168" font-size="7.5" font-weight="600" letter-spacing="0.8" fill="#67e8f9" font-family="system-ui, -apple-system, sans-serif">CHAPTER 3</text>
  <text x="200" y="184" font-size="8.5" font-weight="600" fill="#e4e4e7" font-family="system-ui, -apple-system, sans-serif">Backhand push</text>
  <rect x="200" y="196" width="58" height="4" rx="2" fill="#3f4f57"/>
  <rect x="200" y="206" width="50" height="4" rx="2" fill="#3f4f57"/>
  <rect x="200" y="216" width="56" height="4" rx="2" fill="#3f4f57"/>
  <rect x="200" y="226" width="38" height="4" rx="2" fill="#3f4f57"/>

  <text x="160" y="288" text-anchor="middle" font-size="9" fill="#71717a" font-family="system-ui, -apple-system, sans-serif">Every chapter carries what was said</text>
</svg>
