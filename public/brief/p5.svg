<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="A match timeline with the points PongLens found marked along it. One point is selected with a handle at each end, showing that a cut can be adjusted.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="78%"><stop offset="0" stop-color="#151c24"/><stop offset="1" stop-color="#0a0b10"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="320" height="240" fill="url(#bg)"/>
  <rect x="130" y="54" width="60" height="22" rx="11" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1"/>
  <text x="160" y="69" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="0.8" fill="#fde68a" fill-opacity="0.9" font-family="system-ui, -apple-system, sans-serif">BETA</text>
  <rect x="30" y="114" width="260" height="12" rx="6" fill="#1b1b26" stroke="#2a2a38" stroke-width="1"/>
  <rect x="40" y="114" width="34" height="12" rx="4" fill="#22d3ee" fill-opacity="0.7"/>
  <rect x="88" y="114" width="42" height="12" rx="4" fill="#22d3ee" fill-opacity="0.7"/>
  <rect x="146" y="114" width="30" height="12" rx="4" fill="#22d3ee" filter="url(#glow)" fill-opacity="0.6"/>
  <rect x="146" y="114" width="30" height="12" rx="4" fill="#22d3ee"/>
  <rect x="194" y="114" width="48" height="12" rx="4" fill="#22d3ee" fill-opacity="0.7"/>
  <rect x="254" y="114" width="28" height="12" rx="4" fill="#22d3ee" fill-opacity="0.7"/>
  <line x1="146" y1="100" x2="146" y2="140" stroke="#e879f9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="176" y1="100" x2="176" y2="140" stroke="#e879f9" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M136 116 l-4 4 l4 4 M186 116 l4 4 l-4 4" fill="none" stroke="#e879f9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="30" y="160" font-size="9" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0:00</text>
  <text x="290" y="160" text-anchor="end" font-size="9" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">45:00</text>
  <text x="161" y="160" text-anchor="middle" font-size="9" fill="#f0abfc" font-family="system-ui, -apple-system, sans-serif">Adjust a point</text>
</svg>
