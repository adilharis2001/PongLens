  <circle cx="146" cy="148" r="9" fill="#f97316" fill-opacity="0.35" filter="url(#glow)"/>
  <circle cx="146" cy="148" r="5.5" fill="url(#ball)"/>
  <circle cx="126" cy="16" r="8" fill="url(#pl)" stroke="#5c5c68" stroke-width="1.5"/>
  <text x="140" y="19.5" font-size="9" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif">Opponent</text>
  <circle cx="106" cy="204" r="8" fill="url(#pl)" stroke="#7a7a88" stroke-width="1.5"/>
  <text x="106" y="227" text-anchor="middle" font-size="9" fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif">You</text>
