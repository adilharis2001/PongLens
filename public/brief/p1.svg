<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Seen from above: the camera stands to one side of the table, level with your half, on the side you do not serve from, and its view takes in the whole table.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="78%"><stop offset="0" stop-color="#151c24"/><stop offset="1" stop-color="#0a0b10"/></radialGradient>
    <linearGradient id="cone" x1="262" y1="150" x2="120" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#113a40"/><stop offset="1" stop-color="#0c2328"/></linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffedd5"/><stop offset="0.4" stop-color="#fdba74"/><stop offset="0.75" stop-color="#f97316"/><stop offset="1" stop-color="#c2410c"/></radialGradient>
    <radialGradient id="pl" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#3b3b46"/><stop offset="1" stop-color="#16161d"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="320" height="240" fill="url(#bg)"/>
  <polygon points="262,150 82,-192 -38,330" fill="url(#cone)"/>
  <line x1="262" y1="150" x2="202" y2="36" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <line x1="262" y1="150" x2="202" y2="186" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <rect x="118" y="36" width="84" height="150" rx="4" fill="none" stroke="#22d3ee" stroke-width="5" stroke-opacity="0.45" filter="url(#glow)"/>
  <rect x="118" y="36" width="84" height="150" rx="4" fill="url(#top)" stroke="#22d3ee" stroke-width="2"/>
  <line x1="160" y1="36" x2="160" y2="186" stroke="#e5f9fd" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="3 5"/>
  <line x1="110" y1="111" x2="210" y2="111" stroke="#e879f9" stroke-width="5" stroke-opacity="0.4" filter="url(#glow)"/>
  <line x1="110" y1="111" x2="210" y2="111" stroke="#e879f9" stroke-width="2.5"/>
  <circle cx="142" cy="72" r="3" fill="#f97316" fill-opacity="0.35"/>
  <circle cx="178" cy="150" r="9" fill="#f97316" fill-opacity="0.35" filter="url(#glow)"/>
  <circle cx="178" cy="150" r="5.5" fill="url(#ball)"/>
  <circle cx="160" cy="18" r="8" fill="url(#pl)" stroke="#5c5c68" stroke-width="1.5"/>
  <text x="174" y="21.5" font-size="9" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif">Opponent</text>
  <circle cx="138" cy="206" r="8" fill="url(#pl)" stroke="#7a7a88" stroke-width="1.5"/>
  <text x="138" y="229" text-anchor="middle" font-size="9" fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif">You</text>
  <g filter="url(#glow)" opacity="0.55"><rect x="262" y="141" width="26" height="17" rx="3" fill="#22d3ee"/><path d="M262 146 l-9 -4 v13 l9 -4 Z" fill="#22d3ee"/></g>
  <rect x="262" y="141" width="26" height="17" rx="3" fill="#22d3ee"/>
  <path d="M262 146 l-9 -4 v13 l9 -4 Z" fill="#22d3ee"/>
  <circle cx="277" cy="149.5" r="4" fill="#0a0a0f"/><circle cx="277" cy="149.5" r="1.6" fill="#22d3ee"/>
  <text x="275" y="176" text-anchor="middle" font-size="9" font-weight="500" fill="#67e8f9" font-family="system-ui, -apple-system, sans-serif">Camera</text>
</svg>
