<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Seen from above: a band of camera positions sweeps from the side of your half round to diagonally behind your corner, and the camera's view takes in the whole table.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="78%"><stop offset="0" stop-color="#151c24"/><stop offset="1" stop-color="#0a0b10"/></radialGradient>
    <linearGradient id="cone" x1="238" y1="179" x2="110" y2="95" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.02"/></linearGradient>
    <radialGradient id="band" cx="168" cy="184" r="94" gradientUnits="userSpaceOnUse"><stop offset="0.42" stop-color="#22d3ee" stop-opacity="0.15"/><stop offset="0.72" stop-color="#22d3ee" stop-opacity="0.12"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.03"/></radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#113a40"/><stop offset="1" stop-color="#0c2328"/></linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffedd5"/><stop offset="0.4" stop-color="#fdba74"/><stop offset="0.75" stop-color="#f97316"/><stop offset="1" stop-color="#c2410c"/></radialGradient>
    <radialGradient id="pl" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#3b3b46"/><stop offset="1" stop-color="#16161d"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <g id="cam"><rect x="-13" y="-8.5" width="26" height="17" rx="3" fill="#22d3ee"/><path d="M-13 -3.5 l-9 -4 v13 l9 -4 Z" fill="#22d3ee"/><circle cx="2" cy="0" r="4" fill="#0a0a0f"/><circle cx="2" cy="0" r="1.6" fill="#22d3ee"/></g>
  </defs>
  <rect width="320" height="240" fill="url(#bg)"/>
  <polygon points="238,179 69,-219 -183,205" fill="url(#cone)"/>
  <line x1="238" y1="179" x2="165.2" y2="7.6" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <line x1="238" y1="179" x2="51.7" y2="190.5" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <path d="M 192.4,145.0 L 217.8,104.3 A 94 94 0 0 1 235.6,249.3 L 201.1,216.0 A 46 46 0 0 0 192.4,145.0 Z" fill="url(#band)"/>
  <path d="M 192.4,145.0 A 46 46 0 0 1 201.1,216.0" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <path d="M 192.4,145.0 L 210.4,116.2 M 201.1,216.0 L 225.5,239.6" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <rect x="84" y="34" width="84" height="150" rx="4" fill="none" stroke="#22d3ee" stroke-width="5" stroke-opacity="0.45" filter="url(#glow)"/>
  <rect x="84" y="34" width="84" height="150" rx="4" fill="url(#top)" stroke="#22d3ee" stroke-width="2"/>
  <line x1="126" y1="34" x2="126" y2="184" stroke="#e5f9fd" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="3 5"/>
  <line x1="76" y1="109" x2="176" y2="109" stroke="#e879f9" stroke-width="5" stroke-opacity="0.4" filter="url(#glow)"/>
