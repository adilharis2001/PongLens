  <text x="224" y="128" font-size="9" font-weight="500" fill="#67e8f9" font-family="system-ui, -apple-system, sans-serif">Side</text>
  <circle cx="216.9" cy="231.2" r="3.5" fill="#22d3ee" fill-opacity="0.9"/>
  <text x="229" y="235" font-size="9" font-weight="500" fill="#67e8f9" font-family="system-ui, -apple-system, sans-serif">Diagonal</text>
  <text x="252" y="150" font-size="8.5" fill="#67e8f9" fill-opacity="0.9" font-family="system-ui, -apple-system, sans-serif">anywhere in</text>
  <text x="252" y="161" font-size="8.5" fill="#67e8f9" fill-opacity="0.9" font-family="system-ui, -apple-system, sans-serif">this band</text>
  <line x1="249" y1="152" x2="236" y2="158" stroke="#67e8f9" stroke-width="1" stroke-opacity="0.5"/>
  <g filter="url(#glow)" opacity="0.55" transform="translate(238,179) rotate(32)"><use href="#cam"/></g>
  <g transform="translate(238,179) rotate(32)"><use href="#cam"/></g>
  <text x="246" y="207" text-anchor="middle" font-size="9" font-weight="500" fill="#67e8f9" font-family="system-ui, -apple-system, sans-serif">Camera</text>
</svg>
