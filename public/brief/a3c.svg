<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="The review screen before saving: a Notes and Transcript switch, the written notes below it, and the Save to student button.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="78%"><stop offset="0" stop-color="#151c24"/><stop offset="1" stop-color="#0a0b10"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="320" height="240" fill="url(#bg)"/>

  <rect x="60" y="26" width="200" height="26" rx="8" fill="#1b1b26" stroke="#2a2a38" stroke-width="1"/>
  <rect x="63" y="29" width="97" height="20" rx="6" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1"/>
  <text x="111" y="43" text-anchor="middle" font-size="9.5" font-weight="600" fill="#67e8f9" font-family="system-ui, -apple-system, sans-serif">Notes</text>
  <text x="209" y="43" text-anchor="middle" font-size="9.5" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif">Transcript</text>

  <rect x="44" y="66" width="232" height="112" rx="12" fill="#14141c" stroke="#2a2a38" stroke-width="1"/>
  <text x="62" y="90" font-size="8.5" font-weight="600" letter-spacing="0.9" fill="#67e8f9" font-family="system-ui, -apple-system, sans-serif">SERVE &amp; RECEIVE</text>
  <circle cx="65" cy="106" r="2" fill="#52525b"/><rect x="74" y="103" width="170" height="5" rx="2.5" fill="#3f3f4a"/>
  <circle cx="65" cy="122" r="2" fill="#52525b"/>
  <rect x="74" y="119" width="96" height="5" rx="2.5" fill="#3f3f4a"/>
  <rect x="74" y="119" width="52" height="5" rx="2.5" fill="#22d3ee" fill-opacity="0.55"/>
  <line x1="129" y1="113" x2="129" y2="130" stroke="#e879f9" stroke-width="2" stroke-linecap="round"/>
  <circle cx="65" cy="138" r="2" fill="#52525b"/><rect x="74" y="135" width="152" height="5" rx="2.5" fill="#3f3f4a"/>
  <circle cx="65" cy="154" r="2" fill="#52525b"/><rect x="74" y="151" width="128" height="5" rx="2.5" fill="#3f3f4a"/>

  <rect x="86" y="196" width="148" height="28" rx="14" fill="#22d3ee" opacity="0.5" filter="url(#glow)"/>
  <rect x="86" y="196" width="148" height="28" rx="14" fill="#22d3ee"/>
  <text x="160" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#0a0a0f" font-family="system-ui, -apple-system, sans-serif">Save to student</text>
</svg>
